name: Nightly restore

# Restores this demo repo to a known-good baseline every night, so anything
# merged or changed during the day's demos is undone. Two layers:
#   1. CODE: force-reset main to the `demo-baseline` tag (deterministic, exact).
#   2. DATA: after the reset redeploys, re-run migrations + reseed, then reset
#      the runtime ops state (outage/spike flags off, errors cleared).
#
# Guardrails (this force-pushes main, so be careful):
#   - Only runs on the known FlyLo demo repos (allowlist).
#   - Aborts loudly if the demo-baseline tag is missing or empty.
#   - Backs up the current main to a dated `pre-reset-backup-<utc-ts>` tag first,
#     keeping ~7 nights of undo (older backup tags are pruned from origin).
#   - Waits for the baseline commit to actually be the live deployment (version
#     match on /v1/health) before touching the DB; fails loudly if it never is.
#   - Gated by a RUN_NIGHTLY_RESET repo variable (set it to "true" to arm).
#
# Promote a new baseline with the separate "Promote demo baseline" workflow.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly (before the 09:00 demo-cleanup)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if RUN_NIGHTLY_RESET is not 'true'"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-reset-${{ github.repository }}
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      ALLOWED_REPOS: "flylo-air/booking-backend flylo-air/booking-frontend flylo-air/crew-app flylo-air/web"
      BASELINE_TAG: demo-baseline
      BACKUP_PREFIX: pre-reset-backup
      BOOKING_API_URL: ${{ vars.BOOKING_API_URL || 'https://booking-api.flylo-air.com' }}
      OPS_SHARED_SECRET: ${{ secrets.OPS_SHARED_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Gate check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual force run; skipping RUN_NIGHTLY_RESET gate."
          elif [ "${{ vars.RUN_NIGHTLY_RESET }}" != "true" ]; then
            echo "RUN_NIGHTLY_RESET is not 'true'; not armed. Exiting without changes."
            echo "armed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_ENV"

      - name: Verify this is an allowed demo repo
        if: success() && env.armed == 'true'
        run: |
          set -euo pipefail
          match=false
          for r in $ALLOWED_REPOS; do
            if [ "$r" = "${{ github.repository }}" ]; then match=true; fi
          done
          if [ "$match" != "true" ]; then
            echo "::error::${{ github.repository }} is not in the demo allowlist. Refusing to reset."
            exit 1
          fi

      - name: Preflight - require FLYLO_ADMIN_PAT when armed
        if: success() && env.armed == 'true'
        env:
          FLYLO_ADMIN_PAT: ${{ secrets.FLYLO_ADMIN_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${FLYLO_ADMIN_PAT}" ]; then
            echo "::error::FLYLO_ADMIN_PAT secret is empty. Set it to an org-owner fine-grained PAT with Contents/Actions/Workflows R/W so force-push can bypass branch protection."
            exit 1
          fi

      - name: Checkout (full history + tags)
        if: success() && env.armed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.FLYLO_ADMIN_PAT }}

      - name: Resolve baseline and back up current main
        if: success() && env.armed == 'true'
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}" || true
          if ! git rev-parse -q --verify "refs/tags/${BASELINE_TAG}" >/dev/null; then
            echo "::error::Baseline tag ${BASELINE_TAG} not found. Aborting (will not touch main)."
            exit 1
          fi
          BASELINE_SHA="$(git rev-list -n1 "refs/tags/${BASELINE_TAG}")"
          if [ -z "$BASELINE_SHA" ]; then
            echo "::error::Baseline resolved empty. Aborting."
            exit 1
          fi
          echo "Baseline ${BASELINE_TAG} -> ${BASELINE_SHA}"
          echo "BASELINE_SHA=${BASELINE_SHA}" >> "$GITHUB_ENV"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          BACKUP_TAG="${BACKUP_PREFIX}-$(date -u +%Y%m%d-%H%M%S)"
          echo "Backing up current main ${CURRENT_MAIN} to tag ${BACKUP_TAG}"
          git tag -f "${BACKUP_TAG}" "${CURRENT_MAIN}"
          git push -f origin "refs/tags/${BACKUP_TAG}"
          echo "BACKUP_TAG=${BACKUP_TAG}" >> "$GITHUB_ENV"
          echo "Pruning old backup tags, keeping the 7 most recent..."
          mapfile -t all_backups < <(git ls-remote --tags origin "refs/tags/${BACKUP_PREFIX}-*" \
            | sed -E 's#.*refs/tags/##' | grep -v '\^{}$' | sort)
          count="${#all_backups[@]}"
          if [ "$count" -gt 7 ]; then
            to_delete=$(( count - 7 ))
            echo "Found ${count} backup tags; deleting ${to_delete} oldest."
            for t in "${all_backups[@]:0:$to_delete}"; do
              echo "Deleting old backup tag ${t}"
              git push origin ":refs/tags/${t}" || true
            done
          else
            echo "Found ${count} backup tags; nothing to prune."
          fi

      - name: Force-reset main to baseline
        if: success() && env.armed == 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse origin/main)" = "${BASELINE_SHA}" ]; then
            echo "main already at baseline; nothing to reset."
            echo "RESET_DONE=already at baseline (${BASELINE_SHA})" >> "$GITHUB_ENV"
          else
            git push --force origin "${BASELINE_SHA}:refs/heads/main"
            echo "main force-reset to ${BASELINE_SHA}"
            echo "RESET_DONE=reset to ${BASELINE_SHA}" >> "$GITHUB_ENV"
          fi

            # Force-pushing main to an already-built baseline SHA does not trigger a new
      # Vercel production deployment (git integration dedupes). Redeploy via API so
      # production aliases move before the health gate runs. Requires repo secrets/vars:
      #   VERCEL_TOKEN (secret)
      #   VERCEL_PROJECT_ID (var or secret) — booking-backend fieldsphere: prj_v9P56J87N9aJaDaROhuyFyaB8vCt
      #   VERCEL_TEAM_ID (var, optional) — anysphere-field: team_zAtvnLEVgWQSSp9x2wNrqUgb
      #   VERCEL_DEPLOY_HOOK_URL (secret, optional fallback)
      - name: Redeploy baseline to Vercel production
        if: success() && env.armed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::warning::VERCEL_TOKEN and/or VERCEL_PROJECT_ID not set; skipping Vercel production redeploy."
            echo "VERCEL_REDEPLOY_STATUS=skipped (missing VERCEL_TOKEN or VERCEL_PROJECT_ID)" >> "$GITHUB_ENV"
            exit 0
          fi
          api_base="https://api.vercel.com"
          team_q=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            team_q="?teamId=${VERCEL_TEAM_ID}"
          fi
          auth_hdr="Authorization: Bearer ${VERCEL_TOKEN}"
          target_sha="$(printf '%s' "${BASELINE_SHA}" | tr '[:upper:]' '[:lower:]')"
          list_url="${api_base}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&limit=100"
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            list_url="${list_url}&teamId=${VERCEL_TEAM_ID}"
          fi
          echo "Looking for a READY Vercel deployment at commit ${target_sha}..."
          deployments_json="$(curl -sS --max-time 30 -H "${auth_hdr}" "${list_url}")"
          deployment_id=""
          if command -v jq >/dev/null 2>&1; then
            deployment_id="$(printf '%s' "$deployments_json" | jq -r --arg sha "$target_sha" '
              .deployments[]?
              | select(.state == "READY")
              | select(
                  ((.meta.githubCommitSha // .meta.gitCommitSha // .meta.commitSha // "") | ascii_downcase) == $sha
                  or ((.gitSource.sha // "") | ascii_downcase) == $sha
                )
              | (.uid // .id)
              ' | head -n1)"
          fi
          redeploy_http=""
          redeploy_body=""
          if [ -n "$deployment_id" ] && [ "$deployment_id" != "null" ]; then
            echo "Found READY deployment ${deployment_id}; requesting production redeploy..."
            redeploy_url="${api_base}/v13/deployments/${deployment_id}/redeploy${team_q}"
            redeploy_http="$(curl -sS -o /tmp/vercel-redeploy.out -w '%{http_code}' --max-time 60 \
              -X POST "${redeploy_url}" \
              -H "${auth_hdr}" \
              -H "Content-Type: application/json" \
              -d '{"target":"production"}' || echo '000')"
            redeploy_body="$(cat /tmp/vercel-redeploy.out)"
            if [ "$redeploy_http" = "404" ] || [ "$redeploy_http" = "405" ]; then
              echo "Redeploy sub-resource not available (HTTP ${redeploy_http}); using create-deployment redeploy..."
              create_q="forceNew=1"
              if [ -n "${VERCEL_TEAM_ID:-}" ]; then
                create_q="${create_q}&teamId=${VERCEL_TEAM_ID}"
              fi
              payload="$(jq -n \
                --arg project "${VERCEL_PROJECT_ID}" \
                --arg dep "$deployment_id" \
                '{ name: $project, project: $project, deploymentId: $dep, target: "production" }')"
              redeploy_http="$(curl -sS -o /tmp/vercel-redeploy.out -w '%{http_code}' --max-time 60 \
                -X POST "${api_base}/v13/deployments?${create_q}" \
                -H "${auth_hdr}" \
                -H "Content-Type: application/json" \
                -d "${payload}" || echo '000')"
              redeploy_body="$(cat /tmp/vercel-redeploy.out)"
            fi
          else
            echo "No READY deployment found for ${target_sha}."
            if [ -n "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
              echo "Triggering VERCEL_DEPLOY_HOOK_URL..."
              redeploy_http="$(curl -sS -o /tmp/vercel-redeploy.out -w '%{http_code}' --max-time 60 \
                -X POST "${VERCEL_DEPLOY_HOOK_URL}" || echo '000')"
              redeploy_body="$(cat /tmp/vercel-redeploy.out)"
            else
              repo="${{ github.repository }}"
              org="${repo%%/*}"
              name="${repo#*/}"
              echo "Creating production deployment from gitSource (org=${org}, repo=${name}, sha=${BASELINE_SHA})..."
              create_q="forceNew=1"
              if [ -n "${VERCEL_TEAM_ID:-}" ]; then
                create_q="${create_q}&teamId=${VERCEL_TEAM_ID}"
              fi
              payload="$(jq -n \
                --arg project "${VERCEL_PROJECT_ID}" \
                --arg org "$org" \
                --arg repo "$name" \
                --arg sha "${BASELINE_SHA}" \
                '{
                  name: $project,
                  project: $project,
                  target: "production",
                  gitSource: { type: "github", org: $org, repo: $repo, ref: "main", sha: $sha }
                }')"
              redeploy_http="$(curl -sS -o /tmp/vercel-redeploy.out -w '%{http_code}' --max-time 60 \
                -X POST "${api_base}/v13/deployments?${create_q}" \
                -H "${auth_hdr}" \
                -H "Content-Type: application/json" \
                -d "${payload}" || echo '000')"
              redeploy_body="$(cat /tmp/vercel-redeploy.out)"
            fi
          fi
          echo "Vercel redeploy HTTP ${redeploy_http}"
          printf '%s\n' "$redeploy_body" | head -c 4000 || true
          if [ "$redeploy_http" -ge 200 ] 2>/dev/null && [ "$redeploy_http" -lt 300 ] 2>/dev/null; then
            new_id=""
            if command -v jq >/dev/null 2>&1; then
              new_id="$(printf '%s' "$redeploy_body" | jq -r '.id // .uid // empty' 2>/dev/null || echo '')"
            fi
            if [ -n "$new_id" ]; then
              echo "VERCEL_REDEPLOY_STATUS=triggered (HTTP ${redeploy_http}, deployment ${new_id})" >> "$GITHUB_ENV"
            else
              echo "VERCEL_REDEPLOY_STATUS=triggered (HTTP ${redeploy_http})" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::Vercel production redeploy request failed (HTTP ${redeploy_http}). Wait-for-health will still gate migrate/ops."
            echo "VERCEL_REDEPLOY_STATUS=failed (HTTP ${redeploy_http})" >> "$GITHUB_ENV"
          fi

      - name: Wait for the baseline deploy to go live
        if: success() && env.armed == 'true'
        run: |
          set -euo pipefail
          echo "Waiting for booking-api to report the baseline commit as the live deployment..."
          target="$(printf '%s' "${BASELINE_SHA}" | tr '[:upper:]' '[:lower:]')"
          matched=false
          live=""
          for i in $(seq 1 30); do
            body="$(curl -s --max-time 10 "${BOOKING_API_URL%/}/v1/health" || echo '')"
            live=""
            if command -v jq >/dev/null 2>&1; then
              live="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || echo '')"
            fi
            if [ -z "$live" ]; then
              live="$(printf '%s' "$body" \
                | grep -o '"commit"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | sed -E 's/.*:[[:space:]]*"([^"]*)".*/\1/' | head -n1 || echo '')"
            fi
            live="$(printf '%s' "$live" | tr '[:upper:]' '[:lower:]')"
            echo "attempt $i: live commit -> ${live:-<none>} (target ${target})"
            # Both are full 40-char lowercased SHAs; match if equal or either
            # is a prefix of the other (guards against any short-SHA edge).
            if [ -n "$live" ]; then
              case "$target" in "$live"*) matched=true ;; esac
              case "$live" in "$target"*) matched=true ;; esac
            fi
            if [ "$matched" = "true" ]; then
              echo "Baseline commit is live."
              break
            fi
            sleep 15
          done
          if [ "$matched" != "true" ]; then
            echo "DEPLOY_MATCH=failed (last live: ${live:-none}, target ${target})" >> "$GITHUB_ENV"
            echo "::error::Baseline commit ${target} did not become the live deployment within the window. Refusing to migrate/reseed against the wrong deployment."
            exit 1
          fi
          echo "DEPLOY_MATCH=matched (live ${live})" >> "$GITHUB_ENV"

      - name: Migrate and reseed
        if: success() && env.armed == 'true'
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL not set; skipping migrate/reseed."
            echo "MIGRATE_STATUS=skipped (no SUPABASE_DB_URL)" >> "$GITHUB_ENV"
            exit 0
          fi
          npm ci
          npm run db:migrate
          npm run db:reseed
          echo "MIGRATE_STATUS=migrated + reseeded" >> "$GITHUB_ENV"

      - name: Reset runtime ops state
        if: success() && env.armed == 'true'
        run: |
          set -euo pipefail
          if [ -z "${OPS_SHARED_SECRET:-}" ]; then
            echo "::warning::OPS_SHARED_SECRET not set; skipping ops reset."
            echo "OPS_STATUS=skipped (no OPS_SHARED_SECRET)" >> "$GITHUB_ENV"
            exit 0
          fi
          code="$(curl -s -o /tmp/reset.out -w '%{http_code}' --max-time 20 \
            -X POST "${BOOKING_API_URL%/}/v1/_ops/reset" \
            -H "Authorization: Bearer ${OPS_SHARED_SECRET}")"
          echo "ops reset -> HTTP $code"
          cat /tmp/reset.out || true
          if [ "$code" != "200" ]; then
            echo "OPS_STATUS=failed (HTTP $code)" >> "$GITHUB_ENV"
            echo "::error::ops reset failed"
            exit 1
          fi
          echo "OPS_STATUS=ok (HTTP $code)" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          armed="${armed:-false}"
          {
            echo "## Nightly restore summary"
            echo ""
            if [ "$armed" = "true" ]; then
              echo "- **Armed:** yes"
            else
              echo "- **Armed:** no (skipped, no changes made)"
            fi
            echo "- **Baseline reset:** ${RESET_DONE:-no reset}"
            echo "- **Baseline SHA:** ${BASELINE_SHA:-none}"
            echo "- **Backup tag:** ${BACKUP_TAG:-none}"
            echo "- **Vercel production redeploy:** ${VERCEL_REDEPLOY_STATUS:-not reached}"
            echo "- **Deploy version-match:** ${DEPLOY_MATCH:-not reached}"
            echo "- **Migrate/reseed:** ${MIGRATE_STATUS:-not reached}"
            echo "- **Ops reset:** ${OPS_STATUS:-not reached}"
          } >> "$GITHUB_STEP_SUMMARY"

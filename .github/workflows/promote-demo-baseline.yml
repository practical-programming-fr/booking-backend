name: Promote demo baseline

# Moves the `demo-baseline` tag to the current main, so the nightly restore
# treats "right now" as the new known-good state. Run this after you have
# merged changes you want to KEEP across nightly resets. Anything not promoted
# is undone by the nightly restore.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the repo name to confirm (owner/repo)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      BASELINE_TAG: demo-baseline
    steps:
      - name: Confirm repo
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${{ github.repository }}" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match ${{ github.repository }}."
            exit 1
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Retag demo-baseline to current main
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Promoting ${BASELINE_TAG} to main ${MAIN_SHA}"
          git tag -fa "${BASELINE_TAG}" "${MAIN_SHA}" -m "Promote demo baseline to ${MAIN_SHA}"
          git push -f origin "refs/tags/${BASELINE_TAG}"
          echo "Done. Nightly restore will now reset to ${MAIN_SHA}."

name: Demo cleanup

# Housekeeping for the "3am outage" demo. In this model the fix PRs opened by
# incident agents are never merged (the demo recovers by flipping the outage
# flag off, not by merging), so nothing needs to be reverted from main. This
# job just tidies up:
#   - closes open PRs labelled `demo` and deletes their branches
#   - resets runtime ops state (flag off, errors cleared, incidents closed)
# Runs nightly and on demand.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BOOKING_API_URL: ${{ vars.BOOKING_API_URL || 'https://booking-api.flylo-air.com' }}
      OPS_SHARED_SECRET: ${{ secrets.OPS_SHARED_SECRET }}
    steps:
      - name: Close demo fix PRs and delete their branches
        run: |
          set -euo pipefail
          nums=$(gh pr list -R "$REPO" --label demo --state open --json number --jq '.[].number')
          if [ -z "$nums" ]; then
            echo "No open demo PRs to close."
          else
            for n in $nums; do
              echo "Closing demo PR #$n"
              gh pr close "$n" -R "$REPO" \
                --comment "Nightly demo cleanup: closing incident fix PR (demo recovers via flag toggle, not merge)." \
                --delete-branch || echo "Could not fully close/delete #$n; continuing."
            done
          fi

      - name: Reset runtime ops state
        run: |
          set -euo pipefail
          if [ -z "${OPS_SHARED_SECRET:-}" ]; then
            echo "::warning::OPS_SHARED_SECRET not set; skipping runtime ops reset."
            exit 0
          fi
          code=$(curl -s -o /tmp/reset.out -w '%{http_code}' \
            -X POST "${BOOKING_API_URL%/}/v1/_ops/reset" \
            -H "Authorization: Bearer ${OPS_SHARED_SECRET}")
          echo "ops reset -> HTTP $code"
          cat /tmp/reset.out || true
          if [ "$code" != "200" ]; then
            echo "::error::Runtime ops reset failed (HTTP $code)"
            exit 1
          fi
